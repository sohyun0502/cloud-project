name: CI Pipeline

# main 브랜치 push 또는 PR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OIDC 토큰 요청 권한
permissions:
  id-token: write   # OIDC 토큰 요청용
  contents: read    # 코드 체크아웃용 (체크아웃 - Repo에 있는 코드를 Runner에 옮김)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 2: 스프링 빌드를 위한 Java 17 설치
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      # Step 3: Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 4: gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 5: 테스트 실행 (CI의 핵심!)
      - name: Run tests
        run: ./gradlew test

      # Step 6: JAR 빌드
      - name: Build JAR
        run: ./gradlew bootJar

      # Step 7: Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ vars.DOCKER_PASSWORD }}

      # Step 8: Docker Hub 이미지 빌드 및 push
      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_NAME=${{ vars.DOCKER_USERNAME }}/cloud-project-app

          docker build --no-cache -t $IMAGE_NAME:$SHORT_SHA .
  
          docker push $IMAGE_NAME:$SHORT_SHA
          
          echo "✅ Pushed: $IMAGE_NAME:$SHORT_SHA"

      # Step 9: EC2 접속 후 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          username: ec2-user
          host: ${{ vars.EC2_HOST }}
          key: ${{ vars.EC2_SSH_KEY }}
          script: |
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            IMAGE_NAME=${{ vars.DOCKER_USERNAME }}/cloud-project-app
            CONTAINER=cloud-project-app

            echo "Docker Hub Login"
            docker login -u ${{ vars.DOCKER_USERNAME }} -p ${{ vars.DOCKER_PASSWORD }}

            echo "Container stop"
            docker stop $CONTAINER || true

            echo "Image delete"
            docker rmi $IMAGE_NAME:$SHORT_SHA || true

            echo "New Image pull"
            docker pull $IMAGE_NAME:$SHORT_SHA

            echo "New Container run"
            docker run -d \
              -p 8080:8080 \
              --name $CONTAINER \
              --restart always \
              $IMAGE_NAME:$SHORT_SHA

            echo "✅ Deployment Complete"